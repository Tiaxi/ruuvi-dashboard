version: 2
updates:
  # Grafana and VictoriaMetrics in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  # Python base and uv images in collector/Dockerfile
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: monthly
    ignore:
      # Stay on Python 3.14: at the versions in uv.lock, httptools, aiohttp,
      # pydantic-core, dbus-fast, uvloop, watchfiles, pyyaml and other
      # compiled deps have no cp315 wheels, and the slim image has no
      # compiler (see #41). Patch bumps still come through. Remove this once
      # the deps ship 3.15 wheels.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  # Collector Python dependencies in collector/pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: /collector
    schedule:
      interval: monthly
    groups:
      # The [dependency-groups] dev packages only affect CI, so every bump,
      # major included, comes as one PR. Keep this list and the
      # exclude-patterns below in sync with collector/pyproject.toml.
      collector-dev-tools:
        patterns:
          - pytest
          - pytest-asyncio
          - aioresponses
          - httpx
          - ruff
      # Runtime minor and patch bumps come as one PR; runtime major bumps
      # stay as separate PRs.
      collector-minor-and-patch:
        exclude-patterns:
          - pytest
          - pytest-asyncio
          - aioresponses
          - httpx
          - ruff
        update-types:
          - minor
          - patch
  # All action bumps come as one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
